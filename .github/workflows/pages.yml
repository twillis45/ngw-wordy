name: Deploy to GitHub Pages

# Temporary dev host so the game is reachable off the local network while
# building. Render is the eventual home; nothing here is Pages-specific
# except NEXT_PUBLIC_BASE_PATH.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to commit SHAs, not tags: a tag is mutable, and
# repointing one is the standard CI supply-chain attack. The trailing
# comment records which version each SHA corresponds to.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      # Must precede the build: the build reads this step's base_url so the
      # share card points at the deployed site instead of localhost.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages

      # Moving to a custom domain is ONE FILE: public/CNAME. Everything that has
      # to change with it is derived here, because the two settings below must
      # agree and hand-editing them in separate places is how they stop agreeing.
      #
      # A project repo is served from /<repo>, so every asset needs that prefix.
      # A custom domain is served from the root, where the same prefix 404s the
      # whole site. The prefix is also why a TWA cannot be built today: its
      # assetlinks.json has to sit at the ORIGIN root, and on the shared
      # github.io host that path is not ours to publish. See docs/DOMAIN_MIGRATION.md.
      - name: Resolve deploy origin
        id: origin
        run: |
          if [ -f public/CNAME ]; then
            domain=$(tr -d '[:space:]' < public/CNAME)
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "share_url=https://$domain" >> "$GITHUB_OUTPUT"
            echo "custom domain: $domain — serving from root, no base path"
          else
            echo "base_path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
            echo "share_url=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "project pages: /${{ github.event.repository.name }}"
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.origin.outputs.base_path }}
          NEXT_PUBLIC_SHARE_URL: ${{ steps.origin.outputs.share_url }}
        run: npm run build

      # Without this, Pages runs Jekyll, which strips every directory starting
      # with an underscore — i.e. all of _next. The site loads with no CSS or JS.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
